# vim: set ft=yaml fenc=utf-8 ff=unix sw=2 ts=2 et :
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_EVENT_RELEASE_TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      # build.ps1 が vcpkg の libebur128 導入と VC++ 環境の初期化を自前で行う
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          ./build.ps1 -Version "${{ steps.version.outputs.version }}" -Release

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path out\redntfy.exe, redntfy.toml, src\sound.wav, src\app.ico `
            -DestinationPath "out\redntfy-${{ steps.version.outputs.version }}-x64.zip" `
            -Force

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "out/redntfy-${VERSION}-x64.zip" \
            --clobber
